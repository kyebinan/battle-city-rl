[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battle-city-rl"
version = "0.1.0"
description = "Battle City NES — RL/MARL research environment"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["battle_city*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]